name: Browser checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run check
        working-directory: web
      - name: Verify reproducible committed browser output
        run: git diff --exit-code -- docs
          test -z "$(git ls-files --others --exclude-standard docs)"
